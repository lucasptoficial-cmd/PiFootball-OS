<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PiCraft — Mundo</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101820;color:#f4f6f8;font:15px system-ui;overflow:hidden}header{height:54px;background:#172532;border-bottom:2px solid #e98a36;display:flex;align-items:center;justify-content:space-between;padding:0 14px}header b{font-size:20px}button{background:#263b4c;color:white;border:1px solid #506273;border-radius:7px;padding:8px 12px}button:focus{outline:2px solid #ffc15c}#game{display:block;width:100vw;height:calc(100dvh - 124px);touch-action:none}#bar{height:70px;background:#172532;display:flex;align-items:center;justify-content:center;gap:6px;padding:5px;flex-wrap:wrap}.slot{width:48px;height:50px;padding:3px;border:2px solid #71808b;background:#27333d}.slot.active{border:3px solid #ffc15c;background:#46515a}.swatch{display:block;width:23px;height:23px;margin:auto;border:1px solid #ffffff55}.slot small{display:block;font-size:10px;text-align:center}#hint{position:fixed;top:64px;left:10px;background:#101820bb;padding:7px 10px;border-radius:8px;max-width:75vw}#touch{position:fixed;right:10px;bottom:82px;display:grid;grid-template-columns:repeat(3,45px);gap:4px}#touch button{height:42px;background:#182a39dd;font-size:18px}#touch .empty{visibility:hidden}@media(min-width:850px){#touch{opacity:.55}} 
#inventoryPanel{position:fixed;inset:54px 0 70px;display:none;align-items:center;justify-content:center;background:#0009;z-index:5;padding:12px}#inventoryPanel.open{display:flex}.inv-window{width:min(570px,96vw);background:#c6c6c6;color:#222;border:4px solid #555;box-shadow:inset 3px 3px #fff,inset -3px -3px #777;padding:14px;font-family:monospace}.inv-title{font-weight:bold;font-size:18px;margin-bottom:10px}.inv-layout{display:grid;grid-template-columns:1fr 112px;gap:16px}.inv-grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;max-height:270px;overflow-y:auto;padding:2px}.inv-slot{aspect-ratio:1;background:#8b8b8b;border:2px solid;border-color:#555 #fff #fff #555;position:relative;display:grid;place-items:center;padding:0}.inv-slot.selected{outline:3px solid #ffb52e;z-index:1}.inv-slot .swatch{width:70%;height:70%;border:2px solid #333}.inv-slot small{position:absolute;right:2px;bottom:0;color:white;text-shadow:1px 1px #222;font:bold 12px monospace}.inv-side{font-size:12px}.inv-side .craft{display:grid;grid-template-columns:repeat(2,35px);gap:3px;margin:8px 0}.inv-side .craft .inv-slot{width:35px}.inv-sep{height:12px}.inv-label{font-size:13px;margin:9px 0 5px}.inv-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px}@media(max-width:430px){.inv-window{padding:8px}.inv-layout{grid-template-columns:1fr 78px;gap:7px}.inv-side .craft{grid-template-columns:repeat(2,28px)}.inv-side .craft .inv-slot{width:28px}.inv-grid{gap:2px}.inv-title{font-size:15px}}</style></head><body><header><b>⛏ PiCraft · Mundo 0.2</b><div><button id="inventoryButton">Inventário (E)</button> <button id="save">Guardar</button> <button id="back">Menu</button></div></header><canvas id="game"></canvas><div id="inventoryPanel"><div class="inv-window"><div class="inv-title">Inventário</div><div class="inv-layout"><div><div class="inv-label">Inventário</div><div id="mainSlots" class="inv-grid"></div><div class="inv-sep"></div><div class="inv-label">Barra rápida</div><div id="hotSlots" class="inv-grid"></div></div><div class="inv-side"><div class="inv-label">Criação 2 × 2</div><div class="craft"><button class="inv-slot"></button><button class="inv-slot"></button><button class="inv-slot"></button><button class="inv-slot"></button></div><div>Resultado</div><div class="inv-slot" style="width:38px;height:38px;margin-top:5px"></div><p>Seleciona um bloco para a barra rápida.</p><div id='craftRecipes' style='display:grid;gap:4px;margin-top:8px'></div><p>10 tipos de criaturas no mundo.</p></div></div><div class="inv-foot"><span>E / ESC para fechar</span><button id="closeInv">Fechar</button></div></div></div><div id="hint">L2: interagir · R2: partir · L1/R1: item · L3: agachar · R3: correr · △: inventário · D-pad ↓: chat</div><div id="bar"></div><div id="touch"><span class="empty"></span><button data-key="ArrowUp">▲</button><span class="empty"></span><button data-key="ArrowLeft">◀</button><button data-key="Space">●</button><button data-key="ArrowRight">▶</button><span class="empty"></span><button data-key="ArrowDown">▼</button><button data-key="Enter">＋</button></div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const types=[
{id:'relva',name:'Relva',top:'#72ad54',side:'#4b7d3c',edge:'#355d31'},
{id:'terra',name:'Terra',top:'#a8754e',side:'#805339',edge:'#62402e'},
{id:'rocha',name:'Rocha',top:'#a2a9ad',side:'#737d84',edge:'#535c62'},
{id:'madeira',name:'Madeira',top:'#bd8a51',side:'#8b6039',edge:'#68452b'},
{id:'areia',name:'Areia',top:'#e0cc88',side:'#b9a66c',edge:'#92814e'},
{id:'cristal',name:'Cristal',top:'#66c7c2',side:'#398d92',edge:'#28666c'}
];
const extras=[
["Tábuas","#c99558","#95663c","#704727"],["Tijolos","#b96d5d","#8d4c43","#66352f"],["Pedra lisa","#b7bec2","#899197","#646c72"],["Pedra musgosa","#82977a","#62765c","#435640"],["Minério de carvão","#555b60","#373d42","#252a2e"],["Minério de ferro","#b5a18d","#897763","#675847"],["Minério de ouro","#e4c45b","#ad8b32","#80631d"],["Minério de cobre","#c77b50","#965332","#693a25"],["Minério de rubi","#dc5d66","#a83c4a","#702632"],["Minério de safira","#5e9fe0","#3d6fa9","#294c78"],
["Minério de esmeralda","#70c68a","#448b60","#2c6242"],["Minério de ametista","#aa82d4","#7955a5","#523875"],["Neve","#eff7ff","#c7d9e8","#9aafc2"],["Gelo","#a6d9ed","#73afca","#4b829d"],["Gelo azul","#62b5dc","#4385ad","#2d607f"],["Argila","#b58c85","#8d6966","#694b4a"],["Cascalho","#9b9990","#74736d","#55544f"],["Lama","#78634c","#594936","#3d3024"],["Musgo","#72965d","#506f43","#344d2b"],["Folhas","#5d9b4e","#42733a","#2d5228"],
["Tronco de pinheiro","#a77b50","#795638","#563a25"],["Tronco de bétula","#e1d4ad","#b7a77e","#8c7d59"],["Tronco de acácia","#bd7045","#8e4e32","#633322"],["Folhas de pinheiro","#477b55","#315b40","#21402d"],["Folhas de bétula","#91b96b","#678d49","#48652f"],["Areia vermelha","#d28a58","#a9673d","#78472b"],["Terracota","#b96c55","#8e4e40","#63352d"],["Terracota azul","#638aa8","#46677f","#30495c"],["Concreto branco","#e8e5dc","#bcbab3","#92918b"],["Concreto preto","#45494e","#303338","#202226"],
["Concreto vermelho","#bd5353","#8d383b","#62272c"],["Concreto azul","#4e79bd","#38588e","#263f68"],["Concreto verde","#5c9b62","#3f7145","#2b5031"],["Lã branca","#f2eee2","#c6c2b7","#96938a"],["Lã vermelha","#d45d5d","#a13e43","#702b32"],["Lã azul","#5b82c8","#3f5e96","#2b416a"],["Lã amarela","#e5c94f","#ae9636","#7c6b24"],["Vidro","#b9e8ed","#7fbac2","#568a94"],["Bloco de luz","#f7e7a0","#d7bb69","#a88e45"],["Obsidiana","#55466e","#392e4c","#241e33"],
["Basalto","#555d65","#3b4249","#282e34"],["Mármore","#e3ded5","#b8b1a6","#8c857b"],["Calcário","#d4c6a3","#a99a78","#7e7257"],["Coral","#e78c83","#b96261","#874143"],["Algas","#4c987d","#34715d","#245342"],["Esponja","#d9d16c","#aaa34a","#777333"],["Mel","#d69a36","#a66d20","#744915"],["Cera","#e8d49b","#bda96f","#8c7b4d"],["Âmbar","#c98236","#99591f","#673b16"],["Meteorito","#77718e","#524d69","#373348"]
];
extras.forEach((b,i)=>types.push({id:"extra_"+i,name:b[0],top:b[1],side:b[2],edge:b[3]}));
const mobs=["Ovelha","Vaca","Porco","Galinha","Coelho","Zumbi","Esqueleto","Aranha","Golem de pedra","Slime"];
const recipes=[["Tábuas",3,1,6,4],["Tijolos",2,2,7,2],["Pedra lisa",2,2,8,2],["Pedra musgosa",2,2,9,2],["Vidro",4,2,43,2],["Bloco de luz",5,2,44,1],["Concreto branco",4,2,34,2],["Obsidiana",2,4,45,1]];
const W=17,H=17,world=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>({z:(x*7+y*11)%13===0?1:0,t:(x+y)%8===0?3:(x*3+y)%7===0?2:0})));
let player={x:8,y:8},selected=0,aim={x:9,y:8},inventory=types.map((_,i)=>i===0?24:(i<6?8:0)),mobList=[],tick=0,inventoryOpen=false;
const tileW=38,tileH=20,blockH=17;
function resize(){const d=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.floor(canvas.clientWidth*d);canvas.height=Math.floor(canvas.clientHeight*d);ctx.setTransform(d,0,0,d,0,0);draw()}addEventListener('resize',resize);
function iso(x,y,z=0){return {x:canvas.clientWidth/2+(x-y)*tileW/2,y:canvas.clientHeight/2-55+(x+y)*tileH/2-z*blockH}}
function polygon(points,fill,stroke='#00000030'){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.stroke()}
function diamond(x,y,w,h,color){polygon([{x,y:y-h/2},{x:x+w/2,y},{x,y:y+h/2},{x:x-w/2,y}],color)}
function block(x,y,z,t){const p=iso(x,y,z),b=types[t];polygon([{x:p.x,y:p.y},{x:p.x+tileW/2,y:p.y+tileH/2},{x:p.x,y:p.y+tileH},{x:p.x-tileW/2,y:p.y+tileH/2}],b.top);polygon([{x:p.x-tileW/2,y:p.y+tileH/2},{x:p.x,y:p.y+tileH},{x:p.x,y:p.y+tileH+blockH},{x:p.x-tileW/2,y:p.y+tileH/2+blockH}],b.edge);polygon([{x:p.x,y:p.y+tileH},{x:p.x+tileW/2,y:p.y+tileH/2},{x:p.x+tileW/2,y:p.y+tileH/2+blockH},{x:p.x,y:p.y+tileH+blockH}],b.side);
 // tiny original pixel flecks
 for(let k=0;k<3;k++){const fx=p.x+(k-1)*7,fy=p.y+tileH/2+(k%2)*4;ctx.fillStyle='#ffffff20';ctx.fillRect(fx,fy,3,2)}
}
function draw(){if(!ctx)return;const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);const sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#8fc4df');sky.addColorStop(1,'#d6e7d0');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);
for(let sum=0;sum<W+H;sum++)for(let y=0;y<H;y++){const x=sum-y;if(x<0||x>=W)continue;const c=world[y][x];diamond(iso(x,y).x,iso(x,y).y+tileH/2,tileW,tileH,c.z?'#6b8d55':'#6d9c58');if(c.z)block(x,y,0,c.t)}
// avatar is deliberately simple and original
mobList.forEach(m=>{const q=iso(m.x,m.y,world[m.y][m.x].z);ctx.fillStyle=['#eee8dc','#76533e','#e69a9a','#fff4df','#c9b8a2','#4b9b62','#d8d6c9','#40313b','#899397','#75cf91'][m.kind];ctx.fillRect(q.x-7,q.y-17,14,15);ctx.fillStyle='#18212a';ctx.font='10px system-ui';ctx.fillText(mobs[m.kind].slice(0,3),q.x-9,q.y-20)});\nconst p=iso(player.x,player.y,world[player.y][player.x].z);ctx.fillStyle='#263b52';ctx.fillRect(p.x-7,p.y-8,14,18);ctx.fillStyle='#e4b58d';ctx.fillRect(p.x-6,p.y-21,12,12);ctx.fillStyle='#e9d7a5';ctx.fillRect(p.x-6,p.y-20,12,3);
const a=iso(aim.x,aim.y,world[aim.y][aim.x].z);polygon([{x:a.x,y:a.y},{x:a.x+tileW/2,y:a.y+tileH/2},{x:a.x,y:a.y+tileH},{x:a.x-tileW/2,y:a.y+tileH/2}], '#ffffff12','#fff3a0');
ctx.fillStyle='#14202bdc';ctx.fillRect(10,h-36,190,26);ctx.fillStyle='white';ctx.font='13px system-ui';ctx.fillText('Posição '+player.x+', '+player.y+'  ·  Dia '+(1+Math.floor(tick/180)),18,h-18)}
function sound(freq=180,dur=.07){try{const ac=new (AudioContext||webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=freq;g.gain.setValueAtTime(.045,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur);o.onended=()=>ac.close()}catch(e){}}
function move(dx,dy){if(mobList.length<10&&Math.random()<.3)mobList.push({x:Math.floor(Math.random()*W),y:Math.floor(Math.random()*H),kind:Math.floor(Math.random()*mobs.length)});mobList.forEach(m=>{if(Math.random()<.3){m.x=Math.max(0,Math.min(W-1,m.x+(Math.random()<.5?-1:1)));m.y=Math.max(0,Math.min(H-1,m.y+(Math.random()<.5?-1:1)))}});const x=Math.max(0,Math.min(W-1,player.x+dx)),y=Math.max(0,Math.min(H-1,player.y+dy));player={x,y};aim={x:Math.max(0,Math.min(W-1,x+dx)),y:Math.max(0,Math.min(H-1,y+dy))};tick++;sound(240,.035);draw()}
function action(place){const c=world[aim.y][aim.x];if(place){if(inventory[selected]>0&&!c.z){c.z=1;c.t=selected;inventory[selected]--;sound(420,.08)}}else if(c.z){c.z=0;inventory[c.t]=(inventory[c.t]||0)+1;sound(110,.12)}draw();renderBar()}
function toggleInventory(force){inventoryOpen=typeof force==="boolean"?force:!inventoryOpen;document.getElementById("inventoryPanel").classList.toggle("open",inventoryOpen);if(inventoryOpen)renderInventory()}
function renderInventory(){const box=document.getElementById('craftRecipes');if(box){box.innerHTML='<b>Receitas</b>';recipes.forEach(r=>{const b=document.createElement('button');b.textContent=r[0]+' ('+r[2]+' materiais)';b.onclick=()=>{if((inventory[r[1]]||0)<r[2]){document.getElementById('hint').textContent='Faltam materiais.';return}inventory[r[1]]-=r[2];inventory[r[3]]=(inventory[r[3]]||0)+r[4];renderBar();renderInventory();sound(520,.1)};box.appendChild(b)})}const main=document.getElementById("mainSlots"),hot=document.getElementById("hotSlots");main.innerHTML="";hot.innerHTML="";for(let i=0;i<types.length;i++){const slot=document.createElement("button");slot.className="inv-slot";if(i<types.length&&inventory[i]>0){slot.innerHTML='<span class="swatch" style="background:'+types[i].top+'"></span><small>'+inventory[i]+'</small>';slot.title=types[i].name;slot.onclick=()=>{selected=i;renderBar();renderInventory();sound(330)}}main.appendChild(slot)}for(let i=0;i<9;i++){const slot=document.createElement("button");slot.className="inv-slot"+(selected===i?" selected":"");if(i<types.length){slot.innerHTML='<span class="swatch" style="background:'+types[i].top+'"></span><small>'+inventory[i]+'</small>';slot.title=types[i].name;slot.onclick=()=>{selected=i;renderBar();renderInventory();sound(330)}}hot.appendChild(slot)}}
function renderBar(){const bar=document.getElementById('bar');bar.innerHTML='';types.slice(0,9).forEach((t,i)=>{const b=document.createElement('button');b.className='slot'+(selected===i?' active':'');b.innerHTML='<span class="swatch" style="background:'+t.top+'"></span><small>'+t.name+' · '+inventory[i]+'</small>';b.onclick=()=>{selected=i;renderBar();sound(300)};bar.appendChild(b)})}
document.getElementById('inventoryButton').onclick=()=>toggleInventory();document.getElementById('closeInv').onclick=()=>toggleInventory(false);
/* Mapeamento confirmado para comando PlayStation dentro do PiCraft.
   L2 interagir/colocar · R2 partir · L1/R1 hotbar · L3 agachar · R3 correr
   Analógico esquerdo mover · analógico direito orientar alvo/câmara
   Triângulo inventário · Cruz saltar · D-pad baixo chat · Options sair/pausa
   D-pad direito alterna Survival > Criativo > Aventura > Espectador. */
let padPrevious=[],padDirectionAt=0,aimDirectionAt=0;
let gameModeIndex=0,sneaking=false,sprinting=false;
const gameModes=["Survival","Criativo","Aventura","Espectador"];
let chatOpen=false;
function showChat(){
  let panel=document.getElementById("picraftChat");
  if(!panel){
    panel=document.createElement("div");
    panel.id="picraftChat";
    panel.style.cssText="position:fixed;left:16px;bottom:82px;width:min(440px,90vw);padding:12px;background:#090d12ed;border:2px solid #ff9800;border-radius:12px;z-index:8;color:white;font:14px system-ui";
    panel.innerHTML='<b>Chat local PiCraft</b><div id="picraftChatLog" style="height:90px;overflow:auto;margin:8px 0;color:#ddd">Chat local — multiplayer ainda não ligado.</div><input id="picraftChatInput" maxlength="120" placeholder="Escreve uma mensagem..." style="width:100%;padding:9px;background:#18232d;color:white;border:1px solid #ff9800;border-radius:6px">';
    document.body.appendChild(panel);
    panel.querySelector("input").addEventListener("keydown",e=>{
      if(e.key==="Enter"&&e.target.value.trim()){
        const line=document.createElement("div");line.textContent="Tu: "+e.target.value.trim();
        document.getElementById("picraftChatLog").appendChild(line);e.target.value="";
      }else if(e.key==="Escape"){chatOpen=false;panel.style.display="none"}
    });
  }
  chatOpen=!chatOpen;panel.style.display=chatOpen?"block":"none";
  if(chatOpen)panel.querySelector("input").focus();
}
function setGameMode(){
  gameModeIndex=(gameModeIndex+1)%gameModes.length;
  document.getElementById("hint").textContent="Modo de jogo: "+gameModes[gameModeIndex];
}
function jump(){
  sound(360,.07);
  document.getElementById("hint").textContent="Salto · "+gameModes[gameModeIndex];
}
function pollGamepads(now){
  const pads=navigator.getGamepads?navigator.getGamepads():[];
  for(const pad of pads){
    if(!pad)continue;
    const buttons=pad.buttons||[];
    const pressed=i=>!!buttons[i]?.pressed;
    const was=i=>!!padPrevious[pad.index]?.[i];
    const edge=(i,fn)=>{if(pressed(i)&&!was(i))fn()};
    const axes=pad.axes||[],lx=axes[0]||0,ly=axes[1]||0,rx=axes[2]||0,ry=axes[3]||0;
    if(!inventoryOpen&&!chatOpen&&now-padDirectionAt>155){
      if(lx<-.6){move(-1,0);padDirectionAt=now}
      else if(lx>.6){move(1,0);padDirectionAt=now}
      else if(ly<-.6){move(0,-1);padDirectionAt=now}
      else if(ly>.6){move(0,1);padDirectionAt=now}
    }
    if(!inventoryOpen&&!chatOpen&&now-aimDirectionAt>110&&(Math.abs(rx)>.35||Math.abs(ry)>.35)){
      const dx=Math.abs(rx)>.35?(rx>0?1:-1):0;
      const dy=Math.abs(ry)>.35?(ry>0?1:-1):0;
      aim={x:Math.max(0,Math.min(W-1,aim.x+dx)),y:Math.max(0,Math.min(H-1,aim.y+dy))};
      aimDirectionAt=now;draw();
    }
    if(!inventoryOpen&&!chatOpen){
      edge(6,()=>action(true));       // L2: interagir/colocar bloco
      edge(7,()=>action(false));      // R2: partir bloco
      edge(4,()=>{selected=(selected+types.length-1)%types.length;renderBar()}); // L1
      edge(5,()=>{selected=(selected+1)%types.length;renderBar()}); // R1
      edge(3,()=>toggleInventory(true)); // Triângulo: inventário
      edge(0,()=>jump());             // Cruz: saltar
      edge(2,()=>{const c=world[aim.y][aim.x];if(c.z){selected=c.t;renderBar();document.getElementById("hint").textContent="Bloco selecionado: "+types[selected].name}}); // Quadrado: selecionar bloco
      edge(10,()=>{sneaking=!sneaking;document.getElementById("hint").textContent=sneaking?"Agachar (L3)":"Agachar desligado"}); // L3
      edge(11,()=>{sprinting=!sprinting;document.getElementById("hint").textContent=sprinting?"Correr (R3)":"Correr desligado"}); // R3
      edge(13,()=>showChat());        // D-pad baixo: chat
      edge(15,()=>setGameMode());     // D-pad direita: modo de jogo
      edge(9,()=>{location.href="index.html"}); // Options / Start
    }else if(inventoryOpen){
      edge(1,()=>toggleInventory(false)); // Círculo: fechar inventário
      edge(9,()=>toggleInventory(false));
    }else if(chatOpen){
      edge(1,()=>showChat());
    }
    padPrevious[pad.index]=buttons.map(b=>!!b.pressed);
  }
  requestAnimationFrame(pollGamepads);
}
addEventListener("gamepadconnected",e=>{
  document.getElementById("hint").textContent="Comando PlayStation ligado · L2 interagir · R2 partir · L1/R1 itens · △ inventário";
});
addEventListener("gamepaddisconnected",()=>{
  document.getElementById("hint").textContent="Comando desligado · Teclado/WASD ou controlos tácteis";
});
requestAnimationFrame(pollGamepads);
}
addEventListener('gamepadconnected',e=>{
  document.getElementById('hint').textContent='Comando ligado: '+e.gamepad.id+' · analógico esquerdo: mover · R2: partir · R1/L1: itens · Triângulo: inventário';
});
addEventListener('gamepaddisconnected',()=>{
  document.getElementById('hint').textContent='Comando desligado · Teclado/WASD ou controlos tácteis';
